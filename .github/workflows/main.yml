name: Build Web (PlayCanvas)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: Upload Web Build (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird
          path: dist/
